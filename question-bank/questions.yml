    22 626 965 interactions, sans ex aequo (données relevées le 5 octobre 2026). Réponses acceptées : leomessi, Leo Messi
    (casse ignorée).

- id: 2
  session: 7
  problem_sets: [3]
  type: mcq
  stem: 'Quel est le rôle principal de l’opérateur `%>%` dans `dplyr` ?'
  options:
    a: 'Importer des données.'
    b: 'Assigner des variables.'
    c: 'Créer des séquences de fonctions pour simplifier le code.'
    d: 'Convertir des types de données.'
    e: 'Aucune des autres réponses n’est correcte.'
  key: c
  explanation: |
    Le *pipe* `%>%` transmet le résultat d’une fonction comme premier argument de la
    suivante. On enchaîne ainsi les étapes de gauche à droite au lieu d’imbriquer
    les fonctions : `x %>% f() %>% g()` équivaut à `g(f(x))`.
  uses_data: ~

- id: 3
  session: 11
  problem_sets: [4]
  type: mcq
  stem: |
    Vous avez effectué un test t à un échantillon et obtenu une statistique t de
    4.0869 avec 49 degrés de liberté et une valeur p de 0.0001618. Quelle conclusion
    pouvez-vous en tirer au niveau de signification de 5 % ?
  options:
    a: 'Ne pas rejeter l’hypothèse nulle (H0).'
    b: 'Rejeter l’hypothèse nulle (H0).'
    c: 'Il n’y a pas assez d’informations pour conclure.'
    d: 'Augmenter la taille de l’échantillon.'
    e: 'Aucune des autres réponses n’est correcte.'
  key: b
  explanation: |
    La valeur p (0.00016) est bien inférieure au seuil de 0.05 : on rejette H0.
    La moyenne de l’échantillon diffère significativement de la valeur testée.
  uses_data: ~

- id: 4
  session: 2
  type: multi
  stem: 'Exécutez le code R suivant et jugez chaque proposition :'
  code: |
    a <- c(1:5)
    b <- c(5:10)
    c <- a * b
  options:
    a: 'Les longueurs de `a` et `b` sont égales.'
    b: 'Dans cet exemple de code, `c` ne peut être créé que si `a` et `b` sont créés avant.'
    c: '`length(a) <= length(b)`'
    d: 'Dans cet exemple de code, le signe deux-points (`:`) crée des séquences de nombres entiers.'
    e: 'Trois autres réponses sont correctes.'
  drop: [e]
  key: [b, c, d, e]
  explanation: |
    a) `a` a 5 éléments, `b` en a 6 : les longueurs diffèrent (et `length(a) <= length(b)` renvoie `TRUE`).
    b) R doit connaître `a` et `b` pour calculer `a * b`.
    d) `1:5` crée la suite 1, 2, 3, 4, 5.
    Remarque : comme les longueurs diffèrent, R « recycle » le vecteur le plus court et affiche un avertissement, mais `c` est quand même créé.
  uses_data: ~

- id: 5
  session: 1
  type: multi
  stem: 'La fonction `class()` appliquée à une variable à un élément peut donner comme résultat :'
  options:
    a: '`"numeric"`'
    b: '`"logical"`'
    c: '`"character"`'
    d: '`6`'
    e: 'Aucune des autres réponses n’est correcte.'
  drop: [e]
  key: [a, b, c]
  explanation: |
    `class()` renvoie toujours un **texte** décrivant la classe de l’objet, p. ex.
    `class(5)` → `"numeric"`, `class(TRUE)` → `"logical"`, `class("a")` → `"character"`.
    Elle ne renvoie jamais un nombre comme `6`.
  uses_data: ~

- id: 6
  session: 2
  type: multi
  stem: 'Exécutez le code R suivant et jugez chaque proposition :'
  code: |
    nom <- c("Kim", "Claire", "Antoine", "Mathilde", "Ali", "Charlotte", "Tiger", "Sacha")
    genre <- factor(c("non binaire", "femme", "homme", "femme", "homme", "femme", "homme", "homme"),
                    ordered = FALSE)
    revenus_en_milles_chf <- c(77, 154, 15, 82, 104, 48, 540, 63)
    classe_de_revenus <- factor(c("moyen", "haut", "très faible", "moyen", "haut", "faible", "très haut", "moyen"),
                                ordered = TRUE,
                                levels = c("très faible", "faible", "moyen", "haut", "très haut"))

    revenus_df <- data.frame(nom, genre, revenus_en_milles_chf, classe_de_revenus)
    revenus_df
  options:
    a: 'Ce data frame contient deux facteurs.'
    b: '`revenus_df$classe_de_revenus` est une variable catégorielle ordinale.'
    c: '`revenus_df$genre` est une variable catégorielle ordinale.'
    d: 'Ce data frame contient des informations sur trois femmes et trois personnes ayant un haut revenu.'
    e: 'Ce data frame contient des informations sur cinq classes de revenus différentes.'
  key: [a, b, e]
  explanation: |
    a) `genre` et `classe_de_revenus` sont des facteurs (`factor()`). `nom` est une variable textuelle, qui sert d’identifiant.
    b) `classe_de_revenus` est un facteur ordonné (`ordered = TRUE`).
    c) `genre` est créé avec `ordered = FALSE` : il est nominal.
    d) Il y a bien trois femmes, mais seulement deux personnes dans la classe « haut ».
    e) Les cinq niveaux de `classe_de_revenus` apparaissent tous dans les données.
  uses_data: ~
  note: >-
    a) reformulée (« deux facteurs » au lieu de « deux variables catégorielles ») :
    nom est aussi une variable textuelle, le corrigé (a vrai) n’est plus ambigu.

- id: 7
  session: 4
  problem_sets: [2]
  type: multi
  stem: 'Jugez chaque proposition :'
  options:
    a: 'Le paquet `ggplot2` est inclus dans `tidyverse`.'
    b: 'Le paquet `ggplot` est à utiliser pour faire des graphiques avec une variable, tandis que le paquet `ggplot2` est utile pour voir graphiquement la corrélation entre deux variables.'
    c: 'Le responsable de `ggplot2` (qui maintient le paquet) est Thomas Lin Pedersen.'
    d: '`ggplot2` est très utile pour modifier des données.'
    e: '`ggplot2` construit des graphiques de manière incrémentale, en travaillant avec des couches.'
  key: [a, c, e]
  explanation: |
    a) `ggplot2` fait partie des paquets chargés par `library(tidyverse)`.
    b) Il n’existe pas de paquet `ggplot` distinct : `ggplot()` est la fonction principale de `ggplot2`.
    c) `packageDescription("ggplot2")$Maintainer` l’indique.
    d) Pour modifier des données, on utilise `dplyr` ; `ggplot2` sert à les visualiser.
    e) On ajoute les couches les unes aux autres avec `+`.
  uses_data: ~

- id: 8
  session: 2
  problem_sets: [1]
  type: multi
  stem: 'Exécutez le code R suivant et jugez chaque proposition :'
  code: |
    name    <- c("Manny", "Sid", "Diego", "Ellie", "Peaches", "Scrat", "Rudy", "Buck")
    species <- c("mammoth", "sloth", "sabertooth", "mammoth", "mammoth", "squirrel", "dinosaur", "weasel")
    female  <- c(FALSE, FALSE, FALSE, TRUE, TRUE, FALSE, FALSE, FALSE)
    age     <- c(30, 20, 35, 25, 7, 4, 100, 28)
    weight  <- c(5000, 80, 400, 4000, 1000, 1, 10000, 3)

    ice_age_df <- data.frame(name, species, female, age, weight)
    ice_age_df
  options:
    a: 'La colonne `female` (fr. « femelle ») du jeu de données `ice_age_df` est de type logique (*logical*).'
    b: 'Les unités statistiques du jeu de données `ice_age_df` sont les noms, les espèces, le genre (femelle), le poids et l’âge des animaux de l’ère glaciaire.'
    c: 'L’unité statistique du jeu de données `ice_age_df` est un animal de l’âge de glace, avec n = 8 observations.'
    d: 'Le jeu de données `ice_age_df` contient des informations sur trois mammouths différents.'
    e: 'Buck, l’écureuil, pèse 1 kg.'
  key: [a, c, d]
  explanation: |
    a) `female` est créé à partir d’un vecteur de `TRUE`/`FALSE`, donc de type logique.
    b) Ce sont les **variables** (colonnes), pas les unités statistiques.
    c) Chaque ligne correspond à un animal, soit 8 observations.
    d) « mammoth » apparaît trois fois dans `species` (Manny, Ellie, Peaches).
    e) Buck est une belette (*weasel*) de 3 kg. C’est Scrat, l’écureuil, qui pèse 1 kg.
  uses_data: ~

- id: 9
  session: 2
  problem_sets: [1]
  type: multi
  stem: 'Exécutez le code R suivant et jugez chaque proposition :'
  code: |
    name    <- c("Manny", "Sid", "Diego", "Ellie", "Peaches", "Scrat", "Rudy", "Buck")
    species <- c("mammoth", "sloth", "sabertooth", "mammoth", "mammoth", "squirrel", "dinosaur", "weasel")
    female  <- c(FALSE, FALSE, FALSE, TRUE, TRUE, FALSE, FALSE, FALSE)
    age     <- c(30, 20, 35, 25, 7, 4, 100, 28)
    weight  <- c(5000, 80, 400, 4000, 1000, 1, 10000, 3)

    ice_age_df <- data.frame(name, species, female, age, weight)
    print(ice_age_df)
  options:
    a: 'Le code `ice_age_df$name` affiche les éléments de la colonne `name` du jeu de données `ice_age_df`.'
    b: 'Le code `ice_age_df[, 2]` affiche les éléments de la deuxième colonne de `ice_age_df`.'
    c: 'Les dimensions du jeu de données `ice_age_df` sont 8 × 5 (8 lignes et 5 colonnes).'
    d: 'L’objet `ice_age_df` est de type matrice (*matrix*).'
    e: 'Le code `mean(ice_age_df$age)` calcule la moyenne de la colonne `age` du jeu de données `ice_age_df`.'
  key: [a, b, c, e]
  explanation: |
    a) et e) Le `$` extrait une colonne par son nom ; `mean()` en calcule la moyenne.
    b) Dans `[lignes, colonnes]`, laisser les lignes vides sélectionne toutes les lignes de la 2ᵉ colonne.
    c) `dim(ice_age_df)` renvoie `8 5`.
    d) `class(ice_age_df)` renvoie `"data.frame"` : contrairement à une matrice, un data frame peut contenir des colonnes de types différents.
  uses_data: ~
  note: >-
    Dans exercise_problemset_1_final.qmd, la question 8 n’a ni ID ni propositions.
    Son code (print(ice_age_df)) correspond à la question 9 de la banque.

