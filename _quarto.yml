project:
  type: book
  output-dir: _book
  execute-dir: project
  render:
    - index.qmd
    - sessions/*.qmd
    - apropos.qmd
    - corriges.qmd
    - references.qmd
  resources:
    - data/*

lang: fr
language:
  title-block-author-single: "Auteur"
  tools-download: "Télécharger"

book:
  title: "Introduction à R pour les sciences de la communication"
  subtitle: "Développé pour le cours Exercices Méthodes II (Université de Fribourg)"
  author:
    - name: Julian Maitra
      orcid: 0000-0003-3989-5158
      affiliation:
        - name: Université de Fribourg (2023–2025)
          url: https://www.unifr.ch/home/fr/
        - name: Freie Universität Berlin
          url: https://www.fu-berlin.de/
  date: 2026-10-06
  output-file: intro-a-R
  downloads: [pdf]
  site-url: https://julesaberlin.github.io/intro-a-R/
  repo-url: https://github.com/julesaberlin/intro-a-R
  page-footer:
    center: >-
      Textes et exercices : [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr)
      · Code : MIT · Éléments de tiers : voir [À propos](/apropos.qmd)
  chapters:
    - index.qmd
    - sessions/session-01.qmd
    - sessions/session-02.qmd
    - sessions/session-03.qmd
    - sessions/session-04.qmd
    - sessions/session-05.qmd
    - sessions/session-06.qmd
    - sessions/session-07.qmd
    - sessions/session-08.qmd
    - sessions/session-09.qmd
    - sessions/session-10.qmd
    - sessions/session-11.qmd
    - sessions/session-12.qmd
    - sessions/session-13.qmd
    - sessions/session-14.qmd
    - apropos.qmd
  appendices:
    - corriges.qmd
    - references.qmd

bibliography: references.bib
csl: apa-fr.csl

# Version PDF : déplace les réponses des exercices dans l'annexe « Corrigés ».
# Version HTML : espaces insécables avant « : ; ! ? % » et dans « ».
filters:
  - include/corriges.lua
  - include/espaces-insecables.lua

execute:
  freeze: auto

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    # ajouté par webexercises::add_to_quarto()
    css: include/webex.css
    include-after-body: include/webex.js
  pdf:
    pdf-engine: lualatex
    date-format: long
    documentclass: scrreprt
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    fig-pos: "H"
    include-in-header: include/pdf-header.tex
