# Banque de questions du cours Exercices Méthodes II
#
# Questions élaborées par Julian Maitra avec la contribution de Franck Bleu (tuteur en
# méthodes quantitatives, Université de Fribourg, SP 2025).
#
# Une entrée par question de la banque Moodle (ID 1–125, cf. source/solutions_all.qmd).
# Champs :
#   id           numéro de la question dans la banque Moodle
#   session      session (1–12) dont relève la question, selon le sujet
#   problem_sets Problem Set(s) dans lesquels la question figure (1–4)
#   type         vf (Vrai/Faux) | mcq (une seule réponse) | multi (plusieurs
#                réponses, affichées comme une liste de Vrai/Faux) | numeric | text
#   stem         énoncé (Markdown)
#   code         code R à exécuter (affiché, pas évalué)
#   figure       code R qui produit le graphique de la question (évalué au rendu)
#   options      propositions a–e (mcq, multi)
#   drop         propositions « méta » (p. ex. « toutes les autres réponses sont
#                correctes ») omises dans l’affichage Vrai/Faux d’une question multi
#   key          corrigé : true/false (vf), lettre (mcq), liste de lettres (multi),
#                nombre (numeric), texte ou liste de textes acceptés (text) ;
#                TBD = à recalculer avec les données synthétiques (étape 4)
#   tol          tolérance pour les réponses numériques (facultatif)
#   explanation  explication en français (Markdown)
#   uses_data    fichier CSV utilisé (data/), sinon ~
#   variant_of   la question est une variante d’une autre (non affichée par défaut)
#   needs_image  la question dépend d’une image manquante (non affichée)
#   check        corrigé non vérifiable dans R : à relire
#   note         remarque pour l’enseignant (non affichée)

- id: 1
