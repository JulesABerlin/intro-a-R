- id: 16
  session: 1
  type: multi
  stem: 'Exécutez le code R suivant et jugez chaque proposition :'
  code: |
    number <- "7"
  options:
    a: 'Le code `number^2` donne 36 comme résultat dans la console.'
    b: 'Le code `number <- as.numeric(number)` ne change rien à ma variable.'
    c: '`number` peut être utilisé dans la fonction `c()` afin de créer un vecteur.'
    d: '`length(number)` donne une erreur.'
    e: 'Le code `as.numeric(number)^2` donne 36 comme résultat dans la console.'
  key: [c]
  explanation: |
    `number` contient le **texte** `"7"`.
    a) Un calcul sur du texte produit une erreur.
    b) `as.numeric()` transforme le texte en nombre : la classe de `number` change.
    c) `c(number, "8")` crée un vecteur textuel.
    d) `length(number)` renvoie 1.
    e) `as.numeric(number)^2` vaut 49, pas 36.
  uses_data: ~

